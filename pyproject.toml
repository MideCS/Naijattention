[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "naijattention"
version = "0.1.0"
description = "Contrastive learning for English to Nigerian Pidgin translation with mT5"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.2",
  "transformers>=4.44,<5",
  "sentencepiece",
  "protobuf",
  "sacrebleu>=2.4,<3",
  "pandas>=2.0",
  "numpy",
  "matplotlib",
  "tqdm",
]

[project.optional-dependencies]
dev = ["pytest", "jupyter", "nbconvert", "nbformat", "ipykernel"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
